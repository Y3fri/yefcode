    <rect x="72" y="176" width="86" height="26" rx="13" fill="#10152a"/>
    <rect x="168" y="176" width="110" height="26" rx="13" fill="#eef1f7" stroke="#d8deea"/>
    <rect x="288" y="176" width="124" height="26" rx="13" fill="#eef1f7" stroke="#d8deea"/>
    <rect x="422" y="176" width="72" height="26" rx="13" fill="#eef1f7" stroke="#d8deea"/>

